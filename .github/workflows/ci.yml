name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      ministack:
        image: ministackorg/ministack:1.5.22
        ports:
          - 4566:4566

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aws_internal_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aws_internal_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aws_internal_lab
      MINISTACK_ENDPOINT: http://localhost:4566

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Quality checks
        run: pnpm check

      - name: Apply fresh database migrations
        run: pnpm db:migrate

      - name: Database integration tests
        run: pnpm test:integration:db
