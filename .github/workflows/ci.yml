name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      ministack:
        image: ministackorg/ministack:1.5.22
        ports:
          - 4566:4566

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aws_internal_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aws_internal_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aws_internal_lab
      MINISTACK_ENDPOINT: http://localhost:4566

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Quality checks
        run: pnpm check

      - name: Build Standard MiniStack overlay image
        run: docker build -f runtime/standard/ministack.Dockerfile -t aws-internal-lab-ministack:p0 .

      - name: Smoke MiniStack live persist overlay
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name aws-lab-ministack-overlay \
            -p 4567:4566 \
            -e PERSIST_STATE=1 \
            -e STATE_DIR=/tmp/lab-state/state \
            aws-internal-lab-ministack:p0
          cleanup() {
            docker rm -f aws-lab-ministack-overlay >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4567/_ministack/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs aws-lab-ministack-overlay
              exit 1
            fi
            sleep 1
          done

          docker exec \
            -e AWS_ACCESS_KEY_ID=000000000000 \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_DEFAULT_REGION=ap-northeast-1 \
            aws-lab-ministack-overlay \
            aws --endpoint-url http://127.0.0.1:4566 sqs create-queue \
              --queue-name live-persist-probe >/dev/null

          docker exec aws-lab-ministack-overlay python -c \
            "import urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:4566/_aws_internal_lab/persist', data=b'', method='POST'), timeout=10); assert r.status == 200"

          docker exec aws-lab-ministack-overlay test -s /tmp/lab-state/state/sqs.json
          curl --fail --silent http://127.0.0.1:4567/_ministack/health >/dev/null

      - name: Apply fresh database migrations
        run: pnpm db:migrate

      - name: Database integration tests
        run: pnpm test:integration:db
